# =============================================================
# GitHub Actions: Docker Build & Push → GHCR (ghcr.io)
# Trigger: Push auf main + wöchentlicher Schedule + manuell
# Das Digiscreen-Vollpaket wird aus dem offiziellen Release
# (gitlab.eldshort.de) geladen – NIE aus dem Repo, da html/
# dort bewusst ausgeschlossen ist (.gitignore).
# =============================================================
name: 🐳 Build & Push Docker Image to GHCR

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README_EN.md'
      - 'CHANGELOG.md'
  schedule:
    # Wöchentlich Sonntag 03:30 – prüft auf neue Digiscreen-Releases
    - cron: '30 3 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Digiscreen-Vollpaket-Quelle (öffentlich)
  UPSTREAM_BASE: https://gitlab.eldshort.de/uivens/digiscreen

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------------------------
      # 1. Neueste Digiscreen-Version ermitteln (automatisch)
      # -----------------------------------------------------
      - name: 🔎 Neueste Digiscreen-Version ermitteln
        id: latest
        run: |
          JSON=$(curl -fsSL "${{ env.UPSTREAM_BASE }}/-/refs/main/logs_tree/releases?format=json&ref_type=HEADS")
          LATEST=$(echo "$JSON" | jq -r '.[].file_name' | sort -V | tail -1)
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "✅ Neueste Version gefunden: $LATEST"

      # -----------------------------------------------------
      # 2. Vollpaket herunterladen & entpacken (in html/)
      # -----------------------------------------------------
      - name: 📦 Digiscreen-Vollpaket ${{ steps.latest.outputs.version }} laden
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          ZIP_URL="${{ env.UPSTREAM_BASE }}/-/raw/main/releases/${VERSION}/digiscreen_compiled_${VERSION}.zip"
          echo "Download: $ZIP_URL"
          mkdir -p html
          curl -fsSL -o digiscreen.zip "$ZIP_URL"
          unzip -q digiscreen.zip -d html
          rm digiscreen.zip
          # Sicherstellen, dass das Vollpaket vollständig ist
          test -f html/index.html || { echo "❌ index.html fehlt – Vollpaket unvollständig!"; exit 1; }
          echo "✅ Vollpaket entpackt:"
          ls html | head

      # -----------------------------------------------------
      # 3. Responsive-Patch (1024px → 600px) ins Image backen
      #    Das ersetzt den bisherigen Laufzeit-Patch aus
      #    update_digiscreen.sh – kein Patch mehr auf dem Server!
      # -----------------------------------------------------
      - name: 🔧 Responsive-Patch anwenden (1024px → 600px)
        run: |
          JS_FILE=$(find html/static/assets/ -name "index-*.js" ! -name "*.bak" 2>/dev/null | head -1)
          if [ -z "$JS_FILE" ]; then
            echo "⚠️ JS-Hauptdatei nicht gefunden – Patch übersprungen."
          else
            echo "📄 Patche: $JS_FILE"
            sed -i 's/t<1024?this\.alerte=!0/t<600?this.alerte=!0/g' "$JS_FILE"
            sed -i 's/mindestens 1024px/mindestens 600px/g' "$JS_FILE"
            sed -i 's/at least 1024px/at least 600px/g' "$JS_FILE"
            sed -i 's/minimale de 1024px/minimale de 600px/g' "$JS_FILE"
            sed -i 's/mínimo de 1024px/mínimo de 600px/g' "$JS_FILE"
            sed -i 's/minstens 1024px/minstens 600px/g' "$JS_FILE"
            sed -i 's/najmanje 1024px/najmanje 600px/g' "$JS_FILE"
            if grep -q "t<600?this.alerte" "$JS_FILE"; then
              echo "✅ Responsive-Patch erfolgreich (600px)."
            else
              echo "⚠️ Patch konnte nicht verifiziert werden – bitte prüfen."
            fi
          fi

      # -----------------------------------------------------
      # 4. Docker Buildx Setup + GHCR Login
      # -----------------------------------------------------
      - name: ⚙️ Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login bei GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------
      # 5. Tags: latest + Digiscreen-Version + Commit-SHA
      # -----------------------------------------------------
      - name: 🏷️ Image-Metadaten (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.latest.outputs.version }}
            type=sha

      # -----------------------------------------------------
      # 6. Build & Push nach GHCR
      # -----------------------------------------------------
      - name: 🚀 Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DIGISCREEN_VERSION=${{ steps.latest.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------
      # 7. Status-Zusammenfassung
      # -----------------------------------------------------
      - name: 📊 Zusammenfassung
        if: always()
        run: |
          echo "====================================="
          echo "Image      : ${{ env.REGISTRY }}/${{ github.repository }}"
          echo "Digiscreen : ${{ steps.latest.outputs.version }}"
          echo "Ausgelöst  : ${{ github.event_name }}"
          echo "Commit SHA : ${{ github.sha }}"
          echo "====================================="
