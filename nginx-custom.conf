# =============================================================
# Nginx Konfiguration – Digiscreen
# Injiziert custom.css für Responsive-Fix (< 1024px / 860px)
# =============================================================
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sub-Filter: custom.css in jede HTML-Seite injizieren
    sub_filter '</head>' '<link rel="stylesheet" href="/assets/custom/custom.css"></head>';
    sub_filter_once on;

    # sub_filter benötigt unkomprimierte Antworten
    gzip off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets cachen
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
