# =============================================================
# Digiscreen by La Digitale – Docker Compose Stack
# Portainer-kompatibel | DietPi / Debian
# Image wird von GHCR (ghcr.io) gezogen – kein lokaler Build!
# Neues Image erscheint automatisch bei jedem Push auf main.
# =============================================================
version: '3.8'

services:
  digiscreen:
    # Automatisch gebautes Image aus dem GitHub Container Registry
    # (Workflow: .github/workflows/docker-build.yml)
    image: ghcr.io/jbkunama1/trt.DigiScreen:latest
    container_name: digiscreen
    restart: unless-stopped
    ports:
      - "8080:80"         # Anpassen: z.B. "80:80" oder hinter Traefik/Proxy
    volumes:
      # Custom-Hintergrundbilder (dauerhaft auf dem Server, überschreiben Originals)
      # → Hier einfach deine Bilder in ./html/assets/custom/ legen, Container neustarten.
      - ./html/assets/custom:/usr/share/nginx/html/assets/custom:ro
      # Nginx Sub-Filter: injiziert custom.css für Responsive-Fix
      - ./nginx-custom.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "com.digiscreen.description=Digiscreen by La Digitale"
      - "com.digiscreen.maintainer=therealteacher"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - digiscreen_net

networks:
  digiscreen_net:
    driver: bridge
